<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CainOS — Remnant Operating System</title>
  <style>
    body {
      background: linear-gradient(135deg, #2e0d46 0%, #431c52 100%);

      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .cainos-logo {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 0.5em;

    .remnant {

      color: #ffd6e0;
      font-style: italic;

    .start-btn {
      padding: 0.8em 2em;
      border: none;
      border-radius: 30px;
      background: #e5537d;
      color: #fff;
      font-size: 1.1rem;
      box-shadow: 0 2px 12px #0003;
      cursor: pointer;
      transition: background 0.2s;
    }
    .start-btn:hover {
      background: #ff7fa3;
    }
    footer {
      position: absolute;
      bottom: 16px;
      font-size: 0.8rem;
      color: #c9b6d1;

  <div class="cainos-logo">Cain<span style="color:#ffd6e0;">OS</span></div>
